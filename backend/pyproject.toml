[project]
name = "miles-automation-backend"
version = "0.1.0"
description = "miles-automation backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7",
    "pypdf>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
